[workspace]
resolver = "3"
members = [
    "crates/isle-core",
    "crates/isle-daemon",
    "crates/isle-shelf",
]
# isle-shelf needs the GTK 4 development files,
# so they are only built when asked for: `cargo build -p isle-shelf`.
default-members = ["crates/isle-core", "crates/isle-daemon"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/zickrian/isle"

[workspace.dependencies]
isle-core = { path = "crates/isle-core" }

anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dirs = "6"
env_logger = "0.11"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gdk4-x11 = "0.11"
gtk4 = { version = "0.11", features = ["v4_12"] }
image = { version = "0.25", default-features = false, features = ["png"] }
inotify = { version = "0.11", default-features = false, features = ["stream"] }
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
ureq = { version = "3", features = ["json"] }
url = "2"
x11rb = "0.14"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
lto = "thin"
strip = true
