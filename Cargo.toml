[workspace]
resolver = "3"
members = [
    "crates/pulau-core",
    "crates/pulau-daemon",
    "crates/pulau-island",
    "crates/pulau-shelf",
]
# The GTK crates (pulau-island, pulau-shelf) need the GTK 4 development files,
# so they are only built when asked for: `cargo build -p pulau-shelf`.
default-members = ["crates/pulau-core", "crates/pulau-daemon"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[workspace.dependencies]
pulau-core = { path = "crates/pulau-core" }

anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dirs = "6"
env_logger = "0.11"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gdk4-x11 = "0.11"
gtk4 = { version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
ureq = { version = "3", features = ["json"] }
url = "2"
x11rb = "0.14"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
lto = "thin"
strip = true
