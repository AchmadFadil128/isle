# cargo-deny: `cargo deny check` (CI runs it). Known security advisories, and only licences
# that can be shipped inside a GPL-3.0-or-later program.

[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
# Unmaintained crates are reported for those Isle uses directly, not for everything below them.
unmaintained = "workspace"
ignore = []

[licenses]
# All compatible with the GPL version 3 (Apache-2.0 is not with version 2, which Isle does not use).
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Workspace crates refer to each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
