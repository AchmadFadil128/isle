name: Release

# Builds the ready-to-install packages for a version tag (v1.2.3): the tarball get.sh installs, a .deb
# and an .rpm, each with a build provenance attestation, and attaches them to the tag's GitHub release,
# creating the release if needed. Run by hand, it only builds them as a workflow artifact.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  # For the provenance attestations: `gh attestation verify <file> --repo zickrian/isle`.
  id-token: write
  attestations: write

jobs:
  package:
    # Built against Ubuntu 24.04's GLib and GTK, the oldest GNOME 46 system.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check the version
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$version\"" Cargo.toml || { echo "Cargo.toml is not at $version"; exit 1; }
          grep -q "\"version-name\": \"$version\"" gnome-extension/metadata.json ||
            { echo "metadata.json is not at $version"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no $version"; exit 1; }
      # GTK 4 for isle-shelf, rpmbuild for the .rpm; cmake, libclang, the Vulkan headers and glslc for isle-whisper.
      - name: Install build dependencies
        run: |
          # man-db's index rebuild can stall apt for many minutes on the runners; nothing here needs it.
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev rpm file cmake g++ clang libclang-dev libvulkan-dev glslc
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#v}"; else version=""; fi
          tarball="$(scripts/package.sh ${version:+"$version"} | tail -n1)"
          scripts/package-system.sh "$tarball"
          cd dist
          for file in *.deb *.rpm; do sha256sum "$file" > "$file.sha256"; done
          ls -l
      - name: Attest build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: isle-package
          path: dist/*
      - name: Attach to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          files=(dist/*.tar.gz dist/*.deb dist/*.rpm dist/*.sha256)
          # The version's own section of the changelog.
          awk -v v="${tag#v}" 'index($0, "## [" v "]") == 1 {on = 1; next} /^## \[/ {on = 0} on' CHANGELOG.md > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            # Made with its files in one go: get.sh never finds a release without them.
            gh release create "$tag" "${files[@]}" --title "Isle ${tag#v}" --notes-file notes.md
          fi
