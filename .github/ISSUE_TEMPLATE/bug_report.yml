name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Security problems go privately to the maintainer instead; see [SECURITY.md](https://github.com/zickrian/isle/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the island
        2. Click …
    validations:
      required: true
  - type: input
    id: isle-version
    attributes:
      label: Isle version
      description: The output of `isled --version`.
      placeholder: isled 0.6.0
    validations:
      required: true
  - type: input
    id: shell-version
    attributes:
      label: GNOME Shell version
      description: The output of `gnome-shell --version`.
      placeholder: GNOME Shell 46.0
    validations:
      required: true
  - type: dropdown
    id: session
    attributes:
      label: Session type
      description: The output of `echo $XDG_SESSION_TYPE`.
      options:
        - Wayland
        - X11
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution and version
      placeholder: Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How Isle was installed
      options:
        - The one-line get.sh install
        - The release tarball's install.sh
        - A .deb or .rpm package
        - The AUR (isle-bin)
        - From source
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `isled --doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        `journalctl --user -u isled -n 100` and `journalctl -b -o cat /usr/bin/gnome-shell | grep -i isle`. Check them for anything private before posting.
      render: text
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots, other extensions you use, …
